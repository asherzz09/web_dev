<!DOCTYPE html>
<html>
<head>
    <title>Photo Grid</title>
    <style>
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 150px);
            gap: 10px;
        }
        .photo-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero {
            grid-column: span 2;
            grid-row: span 2;
        }
        .last {
            grid-column: span 4;
        }
    </style>
</head>
<body>
    <h1>Photo Grid</h1>
    <div class="photo-grid">
        <img class="hero" src="img1.jpg" alt="Photo 1">
        <img src="img2.jpg" alt="Photo 2">
        <img src="img3.jpg" alt="Photo 3">
        <img src="img4.jpg" alt="Photo 4">
        <img src="img5.jpg" alt="Photo 5">
        <img class="last" src="img6.jpg" alt="Photo 6">
    </div>
</body>
</html>
